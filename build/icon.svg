<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="50%" stop-color="#2a1d14"/>
      <stop offset="100%" stop-color="#120b07"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="nodeAlt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Rounded square background (macOS squircle proportions) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#glow)"/>

  <!-- Subtle border highlight -->
  <rect x="6" y="6" width="1012" height="1012" rx="220" ry="220"
        fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Workflow graph: 4 nodes, directed edges, forming an orchestration motif -->
  <g transform="translate(512 512)">
    <!-- Soft halo behind graph -->
    <circle r="280" fill="#f59e0b" opacity="0.10" filter="url(#soft)"/>

    <!-- Edges -->
    <g stroke="#fbbf24" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.95">
      <!-- root -> left -->
      <path d="M 0 -240 L -200 0"/>
      <!-- root -> right -->
      <path d="M 0 -240 L 200 0"/>
      <!-- left -> bottom -->
      <path d="M -200 0 L 0 240"/>
      <!-- right -> bottom -->
      <path d="M 200 0 L 0 240"/>
    </g>

    <!-- Edge glow underlay (broader, faded) -->
    <g stroke="#f59e0b" stroke-width="44" stroke-linecap="round" fill="none" opacity="0.18">
      <path d="M 0 -240 L -200 0"/>
      <path d="M 0 -240 L 200 0"/>
      <path d="M -200 0 L 0 240"/>
      <path d="M 200 0 L 0 240"/>
    </g>

    <!-- Nodes -->
    <!-- top (root agent) -->
    <circle cx="0" cy="-240" r="62" fill="url(#node)"/>
    <circle cx="0" cy="-240" r="62" fill="none" stroke="#fff7ed" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="0" cy="-260" r="14" fill="#fff7ed" opacity="0.55"/>

    <!-- left -->
    <circle cx="-200" cy="0" r="52" fill="url(#nodeAlt)"/>
    <circle cx="-200" cy="0" r="52" fill="none" stroke="#fff7ed" stroke-opacity="0.3" stroke-width="3"/>

    <!-- right -->
    <circle cx="200" cy="0" r="52" fill="url(#nodeAlt)"/>
    <circle cx="200" cy="0" r="52" fill="none" stroke="#fff7ed" stroke-opacity="0.3" stroke-width="3"/>

    <!-- bottom -->
    <circle cx="0" cy="240" r="62" fill="url(#node)"/>
    <circle cx="0" cy="240" r="62" fill="none" stroke="#fff7ed" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="-22" cy="220" r="12" fill="#fff7ed" opacity="0.5"/>
  </g>
</svg>
