name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-mac:
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.11 (node-gyp needs distutils, removed in 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools (provides distutils shim)
        run: python -m pip install --upgrade setuptools

      - name: Decode signing certificate (.p12)
        env:
          MAC_CERTS_BASE64: ${{ secrets.MAC_CERTS_BASE64 }}
        run: |
          echo "$MAC_CERTS_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "CSC_LINK=$RUNNER_TEMP/cert.p12" >> "$GITHUB_ENV"

      - name: Decode App Store Connect API key (.p8)
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build & publish (signed + notarized)
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-mcp-server.mjs && npx tsc -b && npx vite build && npx electron-builder --mac --publish always

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12"
          rm -rf "$RUNNER_TEMP/private_keys"
